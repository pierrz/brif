[project]
name = "brif"
version = "0.2.3"
description = "Docker based tool to deploy IIIF platforms."
authors = [{ name = "Pierre-Edouard Barrault" }]
requires-python = ">=3.8,<3.9"   # pinned after fastapi docker image
dependencies = [
    "aiofiles==0.7.0",
    "anyio==3.4.0",
    "celery==5.2.0",
    "iiif-prezi==0.3.0",
    "itsdangerous==2.0.1",
    "fastapi==0.68.1",
    "Jinja2==3.0.3",
    "lxml==6.1.3",
    "numpy==1.24.4",
    "pydantic==1.8.2",
    "psycopg2-binary==2.9.10",
    "pytest==8.3.5",
    "python-dotenv==0.19.2",
    "requests==2.32.4",
    "setuptools==57.5.0",
    "starlette-core",
    "typing==3.7.4.3",
    "typing_extensions==4.0.0",
]

[dependency-groups]
dev = [
    "black==21.10b0",
    "flake8==4.0.1",
    "isort==5.10.1",
    "pre-commit==2.15.0",
    "pylint==2.11.1",
]

# starlette-core has no release: the commit that app/poetry.lock locked on 'master'
# (resolved_reference), so that the very same code is installed as before the move to uv
[tool.uv.sources]
starlette-core = { git = "https://github.com/accent-starlette/starlette-core", rev = "88e94be0cc65e457e32f2586a3c8860c6c08fca9" }

[tool.pytest.ini_options]
log_cli_level = "WARNING"
filterwarnings = [
    "error",
    "ignore::UserWarning",
    # TODO: remove once Jinja is updated
    "ignore:'contextfunction' is renamed to 'pass_context', the old name will be removed in Jinja 3.1.:DeprecationWarning",
]
