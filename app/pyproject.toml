[project]
name = "brif"
version = "0.2.3"
description = "Docker based tool to deploy IIIF platforms."
authors = [{ name = "Pierre-Edouard Barrault" }]
requires-python = ">=3.8,<3.9"   # pinned after fastapi docker image
dependencies = [
    "aiofiles==24.1.0",
    "anyio==4.5.2",
    "celery==5.5.3",
    "iiif-prezi==0.3.0",
    "itsdangerous==2.2.0",
    "fastapi==0.124.4",
    "httpx==0.28.1",
    "Jinja2==3.1.6",
    "lxml==6.1.3",
    "numpy==1.24.4",
    "pydantic==1.10.27",
    "psycopg2-binary==2.9.10",
    "pytest==8.3.5",
    "python-dotenv==0.19.2",
    "requests==2.32.4",
    "setuptools==75.3.4",
    "starlette==0.44.0",
    "typing_extensions==4.13.2",
]

[dependency-groups]
dev = [
    "black==21.10b0",
    "flake8==4.0.1",
    "isort==5.10.1",
    "pre-commit==2.15.0",
    "pylint==2.11.1",
]

[tool.pytest.ini_options]
log_cli_level = "WARNING"
filterwarnings = [
    "error",
    "ignore::UserWarning",
    # TODO: remove once Jinja is updated
    "ignore:'contextfunction' is renamed to 'pass_context', the old name will be removed in Jinja 3.1.:DeprecationWarning",
]
