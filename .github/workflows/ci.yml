# CI pipeline for brif — test, build and push Docker images to GHCR
# Images: brif-backend (also used for celery), brif-cantaloupe

name: CI pipeline

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - refactor-k8s
  push:
    branches: ["main", "refactor-k8s"]

env:
  REGISTRY: ghcr.io

jobs:

  test:

    name: Run pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: |
          cd app
          poetry install --no-interaction --no-ansi

      - name: Run tests
        run: |
          cd app
          poetry run pytest -v

  build-and-push-backend:

    name: Backend - build/push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/pierrz/brif-backend

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: setup/app/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/pierrz/brif-backend:latest
            ${{ env.REGISTRY }}/pierrz/brif-backend:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

  build-and-push-cantaloupe:

    name: Cantaloupe - build/push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/pierrz/brif-cantaloupe

      - name: Build and push cantaloupe image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: setup/cantaloupe/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/pierrz/brif-cantaloupe:latest
            ${{ env.REGISTRY }}/pierrz/brif-cantaloupe:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
