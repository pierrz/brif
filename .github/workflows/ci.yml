# CI pipeline for brif — build and push Docker images to GHCR
# Images: brif-backend (also used for celery), brif-cantaloupe

name: CI pipeline

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - refactor-k8s
  push:
    branches: ["main", "refactor-k8s"]

env:
  REGISTRY: ghcr.io

jobs:

  build-and-push-backend:

    name: Backend - build/push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/pierrz/brif-backend

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: setup/app/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/pierrz/brif-backend:latest
            ${{ env.REGISTRY }}/pierrz/brif-backend:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

  build-and-push-cantaloupe:

    name: Cantaloupe - build/push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/pierrz/brif-cantaloupe

      - name: Build and push cantaloupe image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: setup/cantaloupe/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/pierrz/brif-cantaloupe:latest
            ${{ env.REGISTRY }}/pierrz/brif-cantaloupe:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
