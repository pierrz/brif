[project]
name = "brif"
version = "0.2.3"
description = "Docker based tool to deploy IIIF platforms."
authors = [{ name = "Pierre-Edouard Barrault" }]
requires-python = ">=3.14,<3.15"   # the version of the Docker images (python:3.14-slim)
dependencies = [
    "celery==5.7.0",
    "iiif-prezi==0.3.0",
    "itsdangerous==2.2.0",
    "fastapi==0.165.0",
    "httpx2==2.16.2",
    "Jinja2==3.1.6",
    "lxml==6.1.3",
    "numpy==2.5.5",
    "pydantic==2.14.4",
    "pydantic-settings==2.8.1",
    "psycopg2-binary==2.9.13",
    "pytest==8.3.5",
    "requests==2.34.2",
    "starlette==1.10.0",
]

[dependency-groups]
dev = [
    "black==21.10b0",
    "flake8==4.0.1",
    "isort==5.10.1",
    "pre-commit==2.15.0",
    "pylint==2.11.1",
]

[tool.pytest.ini_options]
log_cli_level = "WARNING"
filterwarnings = [
    "error",
    "ignore::UserWarning",
    # TODO: remove once Jinja is updated
    "ignore:'contextfunction' is renamed to 'pass_context', the old name will be removed in Jinja 3.1.:DeprecationWarning",
]
