# CI pipeline for brif — run the tests, then build and push Docker images to GHCR
# Images: brif-backend (also used for celery), brif-cantaloupe
# Also checks, on its own, that the Kubernetes example in deploy/k8s renders and is consistent (job k8s-example)

name: CI pipeline

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  # images are only pushed from main: pull request builds used to overwrite ':latest'
  PUSH_IMAGES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:

  test:

    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    # Same services as docker-compose.yml (postgres:14.2 as setup/postgres, rabbitmq:3.8).
    # Cantaloupe and the Celery worker are test doubles, see app/test/conftest.py.
    services:
      postgres:
        image: postgres:14.2
        env:
          POSTGRES_USER: brif
          POSTGRES_DB: brif
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username brif --dbname brif"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      rabbitmq:
        image: rabbitmq:3.8
        env:
          RABBITMQ_DEFAULT_USER: brif
          RABBITMQ_DEFAULT_PASS: brif
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12

    steps:
      # the test fixtures (json) are in Git LFS
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          python-version: "3.14"
          enable-cache: false

      # the very script to run locally: bash scripts/test.sh (Python 3.14, like the images)
      - name: Run the tests
        env:
          PGHOSTADDR: 127.0.0.1
          PGPORT: "5432"
          BRIF_TEST_AMQP_URL: amqp://brif:brif@127.0.0.1:5672//
        run: bash scripts/test.sh

  build-and-push-backend:

    name: Backend - build/push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/pierrz/brif-backend

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: setup/app/Dockerfile
          push: ${{ env.PUSH_IMAGES == 'true' }}
          # not pushed (pull requests): keep the image in the local daemon, to check it below
          load: ${{ env.PUSH_IMAGES != 'true' }}
          tags: |
            ${{ env.REGISTRY }}/pierrz/brif-backend:latest
            ${{ env.REGISTRY }}/pierrz/brif-backend:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Show the pushed image digest in the job summary
        if: env.PUSH_IMAGES == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "- backend: \`${REGISTRY}/pierrz/brif-backend@${DIGEST}\` (tags \`latest\`, \`${GITHUB_SHA}\`)" >> "$GITHUB_STEP_SUMMARY"

      # Images are only built here, so a pull request checks what it built: the versions in the
      # image must be those of app/uv.lock and of the pins of app/pyproject.toml (see the script)
      - name: Install uv
        if: env.PUSH_IMAGES != 'true'
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Check the versions inside the backend image
        if: env.PUSH_IMAGES != 'true'
        env:
          IMAGE: ${{ env.REGISTRY }}/pierrz/brif-backend:${{ github.sha }}
        run: bash scripts/check-image-versions.sh "$IMAGE"

      # setup/celery/Dockerfile is only used by docker-compose: built here, not pushed, to check it
      - name: Build the celery image (not pushed)
        if: env.PUSH_IMAGES != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: setup/celery/Dockerfile
          push: false
          load: true
          tags: brif-celery-check:${{ github.sha }}

      - name: Check the versions inside the celery image
        if: env.PUSH_IMAGES != 'true'
        env:
          IMAGE: brif-celery-check:${{ github.sha }}
        run: bash scripts/check-image-versions.sh "$IMAGE"

  build-and-push-cantaloupe:

    name: Cantaloupe - build/push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/pierrz/brif-cantaloupe

      - name: Build and push cantaloupe image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: setup/cantaloupe/Dockerfile
          push: ${{ env.PUSH_IMAGES == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/pierrz/brif-cantaloupe:latest
            ${{ env.REGISTRY }}/pierrz/brif-cantaloupe:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Show the pushed image digest in the job summary
        if: env.PUSH_IMAGES == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "- cantaloupe: \`${REGISTRY}/pierrz/brif-cantaloupe@${DIGEST}\` (tags \`latest\`, \`${GITHUB_SHA}\`)" >> "$GITHUB_STEP_SUMMARY"

  # No 'needs': it does not wait for the tests or the image builds, and they do not wait for it.
  k8s-example:

    name: Kubernetes example (render and checks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # kustomize is built into kubectl (on the runner) and renders without a cluster: an error fails the job
      - name: Render deploy/k8s
        run: |
          kubectl version --client
          kubectl kustomize deploy/k8s > "$RUNNER_TEMP/k8s-example.yaml"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          python-version: "3.14"
          enable-cache: false

      # resources on every container, nothing specific to a cluster, placeholders only in the Secret example, wiring complete
      - name: Check the render and the manifests
        run: uv run --no-project --with pyyaml==6.0.3 python scripts/check_k8s_example.py "$RUNNER_TEMP/k8s-example.yaml" deploy/k8s
