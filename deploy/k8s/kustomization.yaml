# The brif example for Kubernetes: kubectl apply -k deploy/k8s   (README.md first: the Secret is applied before this)
# Render without applying anything: kubectl kustomize deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: brif

resources:
  - namespace.yaml
  - configmap.yaml
  - data.yaml
  - postgres.yaml
  - rabbitmq.yaml
  - cantaloupe.yaml
  - backend.yaml
  - celery.yaml
  # secret.yaml is not listed on purpose: it holds the real values, it is applied by itself and never rendered or committed.
  # optional/flower.yaml and optional/ingress.yaml are not listed: they are applied by themselves (README.md)

# Images are written as name:tag in the manifests. To pin them by digest without editing the manifests, uncomment this block
